<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>agent-wasm</title>
    <script>
      const url = new URL(window.location.href);
      const segments = url.pathname.split("/").filter(Boolean);
      const basePath = segments[0] === "agent-wasm" || segments[0] === "almostnode"
        ? `/${segments[0]}`
        : "";
      const routePath = `/${segments.slice(basePath ? 1 : 0).join("/")}`;
      const params = new URLSearchParams(url.search);

      if (routePath === "/ide") {
        if (!params.has("template")) {
          params.set("template", "vite");
        }

        url.pathname = `${basePath}/`;
        url.search = params.toString();
      } else if (routePath === "/oauth/callback") {
        // OAuth popup callback path. GH Pages 404s on this URL because no
        // static asset exists at /oauth/callback; the popup is transient
        // (postMessage + window.close) so we handle it inline here rather
        // than booting the SPA. We mirror the route component logic in
        // src/routes/oauth.callback.tsx, which serves the same purpose in
        // dev mode where Vite serves the SPA directly.
        //
        // We relay on TWO channels — `window.opener.postMessage` AND a
        // same-origin `BroadcastChannel` — because Cross-Origin-Opener-
        // Policy frequently nulls `window.opener` during the provider's
        // cross-origin authorize hop. When that happens the opener path
        // is a silent no-op and the BroadcastChannel is the only way the
        // IDE hears back. Keep this in sync with oauth.callback.tsx.
        const payload = {
          type: "almostnode:oauth-callback",
          code: params.get("code") || undefined,
          state: params.get("state") || undefined,
          error: params.get("error") || undefined,
          errorDescription: params.get("error_description") || undefined,
        };
        try {
          if (window.opener) {
            window.opener.postMessage(payload, window.location.origin);
          }
        } catch (err) {
          // Best-effort — BroadcastChannel below is authoritative.
        }
        try {
          if (typeof BroadcastChannel === "function") {
            const channel = new BroadcastChannel("almostnode:oauth-callback-channel");
            channel.postMessage(payload);
            setTimeout(function () { try { channel.close(); } catch (_) { /* ignore */ } }, 0);
          }
        } catch (err) {
          // ignore
        }
        try { window.close(); } catch (err) { /* ignore */ }
        // If window.close() did nothing (e.g. opened in a normal tab),
        // fall through to redirect home.
        url.pathname = `${basePath}/`;
        url.search = "";
      } else {
        url.pathname = `${basePath}/`;
        url.search = "";
      }

      url.hash = "";
      window.location.replace(url.toString());
    </script>
  </head>
  <body></body>
</html>
