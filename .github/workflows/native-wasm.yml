name: native-wasm build

# Compiles a native npm module (better-sqlite3, …) to a wasm32-wasi emnapi
# artifact via emscripten. On failure it files a `native-wasm-compile` issue with
# the structured failure artifact — the input to the reproduce→fix→PR loop. Runs
# on demand (or when the build recipe changes); NOT part of package publishing.

on:
  workflow_dispatch:
    inputs:
      module:
        description: "module to build (napi-hello = minimal green-build proof)"
        required: true
        default: napi-hello
      version:
        description: "version override (blank = recipe default)"
        required: false
        default: ""
  push:
    paths:
      - "packages/native-wasm/modules/**"
      - "packages/native-wasm/scripts/**"
      - ".github/workflows/native-wasm.yml"

permissions:
  contents: read
  issues: write

jobs:
  build:
    name: Build ${{ github.event.inputs.module || 'better-sqlite3' }} → wasm
    runs-on: ubuntu-latest
    env:
      MODULE: ${{ github.event.inputs.module || 'napi-hello' }}
      VERSION: ${{ github.event.inputs.version || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        # No `version:` — the repo's package.json `packageManager` field pins it,
        # and action-setup@v4 errors if both are specified.
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74

      - name: Setup wasi-sdk
        # @napi-rs/wasm-runtime loads wasm32-wasi (threaded) modules, so the
        # correct toolchain is wasi-sdk clang, not emscripten.
        run: |
          ver=24
          curl -sSL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${ver}/wasi-sdk-${ver}.0-x86_64-linux.tar.gz" -o /tmp/wasi-sdk.tar.gz
          mkdir -p "$HOME/wasi-sdk"
          tar xzf /tmp/wasi-sdk.tar.gz -C "$HOME/wasi-sdk" --strip-components=1
          echo "WASI_SDK=$HOME/wasi-sdk" >> "$GITHUB_ENV"

      - name: Install dependencies
        # Non-frozen: this iterative build job may pull in `emnapi` before it's in
        # the committed lockfile. (Publish jobs stay frozen.)
        run: pnpm install --no-frozen-lockfile

      - name: Build module → wasm
        id: build
        continue-on-error: true
        working-directory: packages/native-wasm
        run: |
          if [ -n "$VERSION" ]; then
            node scripts/build-module.mjs "$MODULE" --version "$VERSION"
          else
            node scripts/build-module.mjs "$MODULE"
          fi

      - name: Verify wasm
        if: steps.build.outcome == 'success'
        working-directory: packages/native-wasm
        run: |
          if [ -n "$VERSION" ]; then
            node scripts/verify-module.mjs "$MODULE" --version "$VERSION"
          else
            node scripts/verify-module.mjs "$MODULE"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-wasm-${{ env.MODULE }}
          path: |
            packages/native-wasm/dist/*.wasm
            packages/native-wasm/dist/*.manifest.json
            packages/native-wasm/dist/failures/*.json
          if-no-files-found: warn

      - name: File compile-failure issue
        if: steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          issues_enabled=$(gh repo view --json hasIssuesEnabled --jq .hasIssuesEnabled 2>/dev/null || echo "false")
          if [ "$issues_enabled" = "true" ]; then
            gh label create native-wasm-compile --color FBCA04 \
              --description "A native npm module needs a wasm32-wasi build" 2>/dev/null || true
          fi
          for f in packages/native-wasm/dist/failures/*.json; do
            module=$(jq -r .module "$f")
            version=$(jq -r .version "$f")
            phase=$(jq -r .phase "$f")
            exitCode=$(jq -r .exitCode "$f")
            logTail=$(jq -r '.logTail // .message' "$f")
            meta=$(jq -c '{kind:"native-wasm-compile",module:.module,version:.version,phase:.phase}' "$f")
            title="native-wasm: ${module}@${version} failed at ${phase}"
            body=$(printf 'A CI wasm build of `%s@%s` failed at phase **%s** (exit %s).\n\n```\n%s\n```\n\n```json meta\n%s\n```\n' \
              "$module" "$version" "$phase" "$exitCode" "$logTail" "$meta")
            if [ "$issues_enabled" != "true" ]; then
              # Repo config we can't control — don't crash; surface the report in the log.
              echo "::warning::Issues are disabled on this repo; not filing. Failure report follows."
              printf '%s\n' "$body"
              continue
            fi
            # Dedupe on the exact title (module@version + phase).
            existing=$(gh issue list --label native-wasm-compile --search "$title in:title" --json number --jq '.[0].number' || echo "")
            if [ -n "$existing" ]; then
              echo "issue #$existing already tracks this failure"
            else
              gh issue create --title "$title" --body "$body" --label native-wasm-compile || \
                echo "::warning::gh issue create failed; report logged above."
            fi
          done

      # Surface the build failure as a red run (the issue is filed above first).
      - name: Fail run if build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "build failed — a native-wasm-compile issue was filed above."
          exit 1
