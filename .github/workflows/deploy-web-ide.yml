name: Deploy Web IDE and AlmostOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-web-ide
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Setup Rust for Codex wasm
        run: |
          rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.95.0

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install vendored OpenCode/OpenTUI dependencies
        run: pnpm vendor:install:opencode

      - name: Build vendored Codex wasm adapter
        run: pnpm vendor:install:codex

      - name: Smoke-test Codex wasm adapter
        run: pnpm --dir packages/codex-wasm smoke:adapter

      - name: Build web-ide
        run: pnpm nx build web-ide
        env:
          GITHUB_PAGES: true

      - name: Prepare web-ide deploy directory
        run: |
          mkdir -p deploy
          cp -R apps/web-ide/dist-site/client/. deploy/
          cp apps/web-ide/dist-site/client/_shell.html deploy/index.html

      - name: Build AlmostOS
        run: pnpm nx build almost-os
        env:
          GITHUB_PAGES: true
          ALMOSTOS_ORIGIN: https://blamy.github.io

      - name: Add AlmostOS to deploy directory
        run: |
          mkdir -p deploy/os
          cp -R apps/almost-os/dist-site/client/. deploy/os/
          cp apps/almost-os/dist-site/client/_shell.html deploy/os/index.html
          mkdir -p deploy/os/oauth/callback
          cp deploy/os/index.html deploy/os/oauth/callback/index.html

      - name: Verify AlmostOS hosting behavior
        run: |
          pnpm --dir apps/almost-os exec vitest run src/media/player-store.test.ts src/media/virtual-url-map.test.ts
          pnpm --dir packages/almostnode exec vitest run tests/soundcloud-command.test.ts
          pnpm nx test almostnode-sdk

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
